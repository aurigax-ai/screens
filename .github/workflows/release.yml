name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: The tag is v and the package version
        env:
          TAG: ${{ github.ref_name }}
        run: test "$TAG" = "v$(node -p "require('./package.json').version")"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  image:
    needs: [version, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Prepare the image context
        run: |
          mkdir "$RUNNER_TEMP/context"
          cp -r Containerfile package.json dist "$RUNNER_TEMP/context/"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ runner.temp }}/context
          file: ${{ runner.temp }}/context/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/aurigax-ai/screens-desktop:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/aurigax-ai/screens
            org.opencontainers.image.version=${{ github.ref_name }}

  publish:
    needs: [version, ci, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Pin the screen image by digest
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          test -n "$DIGEST"
          printf '{ "image": "ghcr.io/aurigax-ai/screens-desktop@%s" }\n' "$DIGEST" > image.json
      - name: Publish to npm with provenance
        env:
          TAG: ${{ github.ref_name }}
        run: |
          npm --version
          npm publish --provenance --access public --tag "$(case "$TAG" in *-*) echo next ;; *) echo latest ;; esac)"
